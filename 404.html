<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>CitizenInvestor</title>
    <script>
        // GitHub Pages SPA fallback: redirect all 404s to /CitizenInvestor/
        // while preserving the original path for Blazor routing.
        var path = window.location.pathname;
        var repo = "/CitizenInvestor/";
        var target = repo + (path.startsWith(repo) ? path.substring(repo.length) : path.substring(1));
        var qs = window.location.search;
        var hash = window.location.hash;
        window.location.replace(repo + "?" + new URLSearchParams({ p: target }).toString() + hash);
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
